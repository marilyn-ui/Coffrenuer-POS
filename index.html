<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffrenuer POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FBF8F7; --surface:#FFFFFF; --surface2:#F6EFED; --line:#EBDFDC;
  --ink:#2B2120; --ink2:#6E5E5B; --ink3:#9C8D8A;
  --accent:#C23A2F; --accent-h:#A82F26; --on-accent:#FFFFFF; --accent-soft:#FCE9E6;
  --c2:#E59C91; --c3:#D9A441; --c4:#7B5A55; --c5:#5E8C6A;
  --warn:#8A6210; --warn-soft:#F7ECCF; --bad:#9B2318; --bad-soft:#F8DDD9; --good:#3D7A52; --good-soft:#E1EFE5;
  --shadow:0 1px 2px rgba(43,33,32,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1B1413; --surface:#241A19; --surface2:#2E2220; --line:#3D2E2B;
    --ink:#F4EAE8; --ink2:#BAA8A4; --ink3:#85736F;
    --accent:#D9483D; --accent-h:#E5645A; --on-accent:#FFFFFF; --accent-soft:#3E211E;
    --c2:#E59C91; --c3:#DDB05A; --c4:#B58F88; --c5:#7FB08A;
    --warn:#DDB05A; --warn-soft:#3A2F19; --bad:#EE8A7F; --bad-soft:#47221D; --good:#7FBE92; --good-soft:#223528;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1413; --surface:#241A19; --surface2:#2E2220; --line:#3D2E2B;
  --ink:#F4EAE8; --ink2:#BAA8A4; --ink3:#85736F;
  --accent:#D9483D; --accent-h:#E5645A; --on-accent:#FFFFFF; --accent-soft:#3E211E;
  --c2:#E59C91; --c3:#DDB05A; --c4:#B58F88; --c5:#7FB08A;
  --warn:#DDB05A; --warn-soft:#3A2F19; --bad:#EE8A7F; --bad-soft:#47221D; --good:#7FBE92; --good-soft:#223528;
  --shadow:none; color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
body{min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
h2{font-size:22px;font-weight:650;letter-spacing:-.01em}
h3{font-size:17px;font-weight:600}
.muted{color:var(--ink2);font-size:13px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:600;transition:background .15s;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--accent-h)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.lg{min-height:52px;padding:0 28px;font-size:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.btn{cursor:pointer}
.link{color:var(--accent);font-weight:500;padding:6px 2px;display:inline-flex;align-items:center;gap:6px}
.link:hover{text-decoration:underline}
.icon-btn{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--ink2)}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
label,.lbl,legend{font-size:13px;color:var(--ink2);font-weight:500}
input[type=text],input[type=password],input[type=number],input[type=search],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;width:100%}
input[type=date]{width:auto}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink);cursor:pointer;min-height:36px;font-weight:400}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{min-height:38px;padding:0 14px;border-radius:8px;color:var(--ink2);font-weight:500;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}
.seg.sm button{min-height:34px;padding:0 12px;font-size:14px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12.5px;font-weight:500;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.go{background:var(--accent);color:var(--on-accent);font-weight:600;padding:0 14px;height:30px}
.chip.out{background:transparent;border:1px solid var(--line);color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h3{margin-bottom:12px}
.empty{padding:28px 16px;text-align:center;color:var(--ink2)}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar .grow{flex:1}
.dates{display:flex;gap:8px;align-items:center}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search .ic{position:absolute;left:12px;top:12px;color:var(--ink3);width:18px;height:18px}
.search input{padding-left:38px}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-weight:600;font-size:14px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.sm{width:34px;height:34px;font-size:12px}.av.lg{width:64px;height:64px;font-size:20px}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.brand p{color:var(--ink2);font-size:13px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.mark{width:30px;height:30px;display:block}
.sub{color:var(--ink2);margin:14px 0}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.back{margin-bottom:6px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:center;font-weight:600;line-height:1.25;min-height:44px}
.person small{color:var(--ink2);font-weight:400;font-size:12px}
.person:hover{border-color:var(--accent)}
.formerr{min-height:20px;color:var(--bad);font-size:13px;margin-bottom:8px}
.hint{margin-top:20px;padding:12px 14px;border-radius:10px;background:var(--surface2);font-size:13px;color:var(--ink2)}
.cam{width:min(260px,68vw);aspect-ratio:1;border-radius:50%;overflow:hidden;margin:6px auto 16px;background:var(--surface2);display:grid;place-items:center;color:var(--ink3)}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam video{transform:scaleX(-1)}
.cam .ic{width:40px;height:40px}
#selfie [data-s]{display:none}
#selfie[data-state=loading] [data-s~=loading],#selfie[data-state=live] [data-s~=live],#selfie[data-state=taken] [data-s~=taken],#selfie[data-state=nocam] [data-s~=nocam]{display:flex}
#selfie .btns{gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
#selfie .btns.col{flex-direction:column}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface)}
.side-brand{display:flex;gap:10px;align-items:center;padding:0 8px 22px;font-weight:650;font-size:17px}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav{display:flex;gap:12px;align-items:center;padding:0 12px;min-height:44px;border-radius:10px;color:var(--ink2);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--surface2)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.chip-user{display:flex;align-items:center;gap:10px;min-width:0}
.who{display:flex;flex-direction:column;line-height:1.25;min-width:0;text-align:left}
.who b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--ink2);font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 28px 10px;gap:12px}
.content{padding:10px 28px 48px}
.tabs{display:none}
@media (max-width:1099px){
  .shell{grid-template-columns:72px minmax(0,1fr)}
  .side{padding:16px 10px;align-items:center}
  .side-brand{padding:0 0 18px}.side-brand .t{display:none}
  .nav{justify-content:center;padding:0;width:48px}.nav span{display:none}
  .side nav{align-items:center}
  .side-foot .who{display:none}.side-foot .btn span{display:none}
  .side-foot .btn{padding:0;width:48px}
  .top,.content{padding-left:20px;padding-right:20px}
}
@media (max-width:767px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink2);padding:6px 0;border-radius:10px;min-height:50px;font-weight:500}
  .tab.on{color:var(--accent);font-weight:600}
  .top{padding:14px 16px 6px}.top .who{display:none}
  h2{font-size:20px}
  .content{padding:8px 16px 112px}
}

/* register */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;font-weight:500;color:var(--ink2)}
.pill.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:border-color .15s}
.tile:hover{border-color:var(--accent)}
.tile:active{background:var(--accent-soft)}
.tile .n{font-weight:600;line-height:1.25;padding-right:22px}
.tile .p{color:var(--ink2);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .badge{position:absolute;top:10px;right:10px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600;display:grid;place-items:center;padding:0 7px}
.tile.out{opacity:.5;cursor:not-allowed}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px}
.tag.low{background:var(--warn-soft);color:var(--warn)}.tag.out{background:var(--bad-soft);color:var(--bad)}.tag.opt{background:var(--surface2);color:var(--ink2)}
.cart{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.cart-h{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px}
.cart-h .r{display:flex;justify-content:space-between;align-items:center}
.cart-h .x{display:none}
.cart-lines{overflow:auto;padding:0 16px;flex:1;min-height:90px}
.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .ln{font-weight:600}
.line .lr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.step{display:inline-flex;align-items:center;gap:6px}
.step b{min-width:22px;text-align:center}
.step button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center}
.step button:hover{background:var(--surface2)}
.cart-f{padding:12px 16px 16px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0}
.row.t{font-size:18px;font-weight:650;padding:8px 0 12px}
.cartbar,.scrim{display:none}
.notice{max-width:440px;margin:24px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
@media (max-width:899px){
  .pos{grid-template-columns:minmax(0,1fr)}
  .cart{position:fixed;left:0;right:0;bottom:0;max-height:88vh;z-index:50;border-radius:18px 18px 0 0;border-bottom:0;transform:translateY(105%);transition:transform .25s;padding-bottom:env(safe-area-inset-bottom,0px)}
  .cart.open{transform:none;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
  .cart-h .x{display:inline-grid}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(30,20,18,.4);z-index:45}
  .cartbar{display:flex;position:fixed;left:20px;right:20px;bottom:20px;z-index:25;min-height:54px;border-radius:14px;background:var(--accent);color:var(--on-accent);align-items:center;justify-content:space-between;padding:0 18px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.18)}
  .pos{padding-bottom:70px}
}
@media (max-width:767px){.cartbar{left:16px;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.cart{transition:none}}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;flex-wrap:wrap}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--surface2)}
.li .grow{flex:1;min-width:0}
.li .grow b{font-weight:600}
.li .acts{display:flex;gap:6px;align-items:center}
.gh{padding:10px 16px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--ink2)}
.meter{width:130px;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:4px}
.meter.warn i{background:var(--c3)}.meter.bad i{background:var(--bad)}
.qty{min-width:92px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.thumb{width:44px;height:44px;border-radius:50%;object-fit:cover;cursor:pointer;background:var(--surface2)}
.shift{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.shift .sr{margin-left:auto;text-align:right}
.shift .sr b{font-size:20px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.meter{display:none}.qty{min-width:0}.shift .sr{margin-left:0;text-align:left}}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi .l{color:var(--ink2);font-size:13px}
.kpi .v{font-size:26px;font-weight:650;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.delta{font-size:12.5px;color:var(--ink2)}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.dash{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:12px}
.w4{grid-column:span 4}.w3{grid-column:span 3}.w2{grid-column:span 2}
@media (max-width:1099px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.w4{grid-column:span 6}.w3,.w2{grid-column:span 3}}
@media (max-width:767px){.w4,.w3,.w2{grid-column:span 6}.kpi .v{font-size:22px}}
.chart svg{display:block;max-width:100%}
.ax{font-size:11px;fill:var(--ink2);font-family:inherit}
.gl{stroke:var(--line);stroke-width:1}
.hb{margin-bottom:12px}.hb:last-child{margin-bottom:0}
.hb-l{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.hb-l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-l b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb-t{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1}.legend b{font-weight:600;font-variant-numeric:tabular-nums}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin-bottom:14px}
.stack i{display:block;height:100%}
.lowrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.lowrow:last-child{border-bottom:0}

/* modal + toast */
#modal .bd{position:fixed;inset:0;background:rgba(30,20,18,.45);display:grid;place-items:center;padding:16px;z-index:80;overflow:auto}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:440px;padding:22px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.wide{max-width:580px}
.sheet h3{margin-bottom:14px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.actions .grow{flex:1}
.big{font-size:34px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px}
.rrow{display:grid;grid-template-columns:1fr 96px 40px;gap:8px;margin-bottom:8px}
.orow{display:grid;grid-template-columns:1fr 84px 52px 40px;gap:8px;margin-bottom:8px;align-items:center}
.orow input[type=radio]{width:20px;height:20px;accent-color:var(--accent);justify-self:center}
.ohead{display:grid;grid-template-columns:1fr 84px 52px 40px;gap:8px;margin-bottom:6px;font-size:12px;color:var(--ink2)}
.ohead span:nth-child(3){text-align:center}
fieldset.og{border:0;padding:0;margin:0 0 16px}
fieldset.og legend{margin-bottom:8px;padding:0}
.opt{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;color:var(--ink);font-size:15px;font-weight:400}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.opt span:first-of-type{flex:1}
.bigphoto{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;margin-bottom:12px}
.catchecks{display:flex;gap:6px 18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:767px){#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (max-width:560px){
  #modal .bd{place-items:end center;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}

/* receipts (shared by preview and print) */
.rcpt .rc-h{text-align:center;margin-bottom:14px;line-height:1.5}
.rcpt .rc-h b{font-size:18px}
.rcpt .rc-l{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:10px 0;margin-bottom:8px}
.rcpt .rc-o{margin:0 0 4px 18px;font-size:12.5px}
.rcpt .rc-f{text-align:center;margin-top:12px}
.rcpt .kl{font-size:16px;margin:8px 0;line-height:1.3}
.rcpt .ko{font-size:13px;color:var(--ink2);margin-left:26px}
#printArea{display:none}
@page{margin:5mm}
@media print{
  :root{padding:0!important}
  html,body{height:auto!important;min-height:0!important;background:#fff!important;color:#000!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;width:72mm;margin:0 auto;color:#000;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #printArea *{color:#000!important;border-color:#000!important}
  #printArea .muted,#printArea .ko{font-size:11px}
  #printArea .rc-h b{font-size:15px}
  #printArea .rcpt{break-inside:avoid;page-break-inside:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printArea" aria-hidden="true"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const DAY = 864e5;
const sod = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
const eod = ts => { const d = new Date(ts); d.setHours(23,59,59,0); return d.getTime(); };
const dstr = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const pday = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const fmtTime = ts => new Date(ts).toLocaleTimeString('en-PH', {hour:'numeric', minute:'2-digit'});
const fmtDate = ts => new Date(ts).toLocaleDateString('en-PH', {month:'short', day:'numeric'});
const fmtDateL = ts => new Date(ts).toLocaleDateString('en-PH', {weekday:'short', month:'short', day:'numeric'});
const money = n => '₱' + (Math.round(n * 100) / 100).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
const money0 = n => '₱' + Math.round(n).toLocaleString('en-PH');
const pf = n => Number.isInteger(n) ? money0(n) : money(n);
const short = n => n >= 1000 ? '₱' + (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : '₱' + Math.round(n);
const num = n => Number(n).toLocaleString('en-PH', {maximumFractionDigits:1});
const initials = n => String(n).split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const round2 = n => Math.round(n * 100) / 100;
const hourLabel = h => h < 12 ? (h === 0 ? '12a' : h + 'a') : (h === 12 ? '12p' : (h - 12) + 'p');
const hm = ms => { const m = Math.max(0, Math.round(ms / 6e4)); return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm'; };

const ICONS = {
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  coffee:'<path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2M10 2v2M14 2v2"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  box:'<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7Z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/>',
  list:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  more:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',
  down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  printer:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>'
};
const LOGO = '<svg class="mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Coffrenuer logo"><g transform="rotate(30 22 11)"><ellipse cx="22" cy="11" rx="5.6" ry="8.2" fill="currentColor" stroke="none"/><path d="M22 3.2c-3.4 3.6 3.4 7.2 0 15.6" stroke="var(--accent)" stroke-width="1.8"/></g><path d="M9 25h24v7a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8z"/><path d="M33 28h2.5a3.8 3.8 0 0 1 0 7.6H32"/><path d="M8 44h26"/></svg>';
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ---------- storage ---------- */
const D_KEY = 'kapehan_pos_v1', S_KEY = 'kapehan_pos_session';
let persistOK = true;
function loadData() { try { const r = localStorage.getItem(D_KEY); if (r) return JSON.parse(r); } catch (e) { persistOK = false; } return null; }
function save() {
  try { localStorage.setItem(D_KEY, JSON.stringify(D)); }
  catch (e) {
    persistOK = false;
    const cut = Date.now() - 14 * DAY;
    D.attendance.forEach(a => { if (a.in < cut) a.photo = null; });
    try { localStorage.setItem(D_KEY, JSON.stringify(D)); persistOK = true; } catch (e2) { toast('Storage is full. Export a backup in Settings.'); }
  }
}
function saveSession() { try { session ? localStorage.setItem(S_KEY, JSON.stringify(session)) : localStorage.removeItem(S_KEY); } catch (e) {} }

/* ---------- seed & migration ---------- */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DISCS = [{label:'No discount', pct:0}, {label:'Promo 10%', pct:10}, {label:'Senior / PWD 20%', pct:20}];

function defaultMods(cats) {
  const o = (name, price, def) => ({id:uid(), name, price:price || 0, def:!!def});
  const drinks = (cats || []).filter(c => !/pastr|bake|food|cake|snack/i.test(c));
  return [
    {id:uid(), name:'Sugar level', type:'single', required:true, cats:drinks, options:[o('0%'), o('25%'), o('50%'), o('75%'), o('100%', 0, true)]},
    {id:uid(), name:'Add-ons', type:'multi', required:false, cats:drinks, options:[o('Pearl', 15), o('Nata de coco', 15), o('Coffee jelly', 20), o('Extra shot', 30)]}
  ];
}
function buildOrder(items, disc, pay, st, type, ts, no) {
  const sub = items.reduce((s, i) => s + i.price * i.qty, 0);
  const d = Math.round(sub * disc.pct) / 100;
  const total = round2(sub - d);
  return {id:uid(), no, ts, staffId:st ? st.id : null, staffName:st ? st.name : 'Admin', type, items, sub, disc:d, discLabel:disc.pct ? disc.label : '', total, pay, tendered:total, change:0, ref:''};
}
function seed() {
  const inv = (name, unit, qty, low) => ({id:uid(), name, unit, qty, low});
  const I = {
    beans:inv('Coffee beans','g',6000,1500), milk:inv('Fresh milk','ml',14000,3500), cup:inv('Cups (12 oz)','pcs',420,100), lid:inv('Lids','pcs',420,100),
    syrup:inv('Caramel syrup','ml',1600,400), choco:inv('Chocolate powder','g',2200,500), matcha:inv('Matcha powder','g',900,250), tea:inv('Fruit tea base','ml',2400,600),
    cro:inv('Croissants','pcs',24,6), bread:inv('Banana bread','slice',22,6), cookie:inv('Choco chip cookies','pcs',36,10), ens:inv('Ensaymada','pcs',20,6),
    pearl:inv('Tapioca pearls','g',3000,800)
  };
  I.syrup.qty = 380;
  const P = (name, cat, price, rec) => ({id:uid(), name, cat, price, active:true, mods:[], recipe:rec.map(([k, q]) => ({inv:I[k].id, qty:q}))});
  const bev = extra => [['cup',1], ['lid',1], ...extra];
  const names = [['Maria Santos','Head barista'],['Jose Reyes','Barista'],['Ana Cruz','Barista'],['Mark Dela Cruz','Barista'],['Jasmine Garcia','Cashier'],
    ['Paolo Mendoza','Cashier'],['Katrina Bautista','Barista'],['Rico Villanueva','Barista'],['Bea Ramos','Cashier'],['Carlo Aquino','Pastry']];
  const cats = ['Coffee', 'Non-coffee', 'Pastry'];
  const data = {
    shop:{name:'Coffrenuer', adminUser:'admin', adminPass:'admin123', nextOrder:1001, theme:'auto', hintOff:false, footer:'Thank you! Come again.', kitchenDefault:false, v2:true, v3:true, staffUser:'staff', staffPass:'staff123'},
    cats, mods:defaultMods(cats),
    staff:names.map((n, i) => ({id:uid(), name:n[0], title:n[1], pin:String(1001 + i), active:true, photo:null})),
    inventory:Object.values(I),
    products:[
      P('Espresso','Coffee',90,bev([['beans',18]])), P('Americano','Coffee',110,bev([['beans',18]])), P('Iced Americano','Coffee',120,bev([['beans',18]])),
      P('Cafe Latte','Coffee',130,bev([['beans',18],['milk',200]])), P('Iced Latte','Coffee',140,bev([['beans',18],['milk',200]])),
      P('Cappuccino','Coffee',130,bev([['beans',18],['milk',150]])), P('Flat White','Coffee',140,bev([['beans',18],['milk',160]])),
      P('Spanish Latte','Coffee',150,bev([['beans',18],['milk',200]])), P('Caramel Macchiato','Coffee',160,bev([['beans',18],['milk',180],['syrup',20]])),
      P('Mocha','Coffee',150,bev([['beans',18],['milk',180],['choco',20]])),
      P('Matcha Latte','Non-coffee',160,bev([['matcha',8],['milk',200]])), P('Hot Chocolate','Non-coffee',140,bev([['choco',30],['milk',200]])),
      P('Fruit Tea','Non-coffee',110,bev([['tea',60]])), P('Brown Sugar Milk Tea','Non-coffee',140,bev([['milk',150],['tea',40]])),
      P('Croissant','Pastry',95,[['cro',1]]), P('Banana Bread','Pastry',85,[['bread',1]]), P('Choco Chip Cookie','Pastry',70,[['cookie',1]]), P('Ensaymada','Pastry',80,[['ens',1]])
    ],
    orders:[], attendance:[]
  };
  const r = rng(42), now = Date.now(), hw = {7:3,8:7,9:8,10:6,11:4,12:5,13:4,14:4,15:6,16:7,17:6,18:5,19:3,20:2};
  const hours = Object.keys(hw).map(Number);
  const pick = (arr, w) => { let t = w.reduce((a, b) => a + b, 0) * r(); for (let i = 0; i < arr.length; i++) { t -= w[i]; if (t <= 0) return arr[i]; } return arr[arr.length - 1]; };
  const pw = data.products.map(p => p.cat === 'Coffee' ? 1.6 : p.cat === 'Pastry' ? .7 : .6);
  const out = [];
  for (let d = 29; d >= 0; d--) {
    const day = sod(now - d * DAY), dow = new Date(day).getDay();
    const n = Math.round((dow === 0 || dow === 6 ? 36 : 26) + r() * 10 - 5);
    for (let i = 0; i < n; i++) {
      const ts = day + pick(hours, hours.map(h => hw[h])) * 36e5 + Math.floor(r() * 36e5);
      if (ts > now) continue;
      const lines = 1 + Math.floor(r() * 3), items = [];
      for (let k = 0; k < lines; k++) {
        const p = pick(data.products, pw), ex = items.find(x => x.pid === p.id);
        if (ex) ex.qty++; else items.push({pid:p.id, name:p.name, cat:p.cat, price:p.price, qty:1 + (r() < .2 ? 1 : 0)});
      }
      const disc = r() < .1 ? DISCS[2] : r() < .08 ? DISCS[1] : DISCS[0];
      const pay = pick(['Cash','GCash','Card'], [.48, .37, .15]);
      const o = buildOrder(items, disc, pay, data.staff[Math.floor(r() * data.staff.length)], r() < .6 ? 'Dine-in' : 'Take-out', ts, 0);
      o.demo = true; out.push(o);
    }
  }
  out.sort((a, b) => a.ts - b.ts).forEach((o, i) => o.no = 1001 + i);
  data.orders = out;
  data.shop.nextOrder = 1001 + out.length;
  return data;
}
function migrate(d) {
  d.shop = d.shop || {}; d.staff = d.staff || []; d.products = d.products || []; d.orders = d.orders || []; d.attendance = d.attendance || []; d.inventory = d.inventory || [];
  if (d.shop.name === 'Kapehan') d.shop.name = 'Coffrenuer';
  if (d.shop.footer === undefined) d.shop.footer = 'Thank you! Come again.';
  if (d.shop.kitchenDefault === undefined) d.shop.kitchenDefault = false;
  if (!d.shop.v2) { d.shop.v2 = true; d.shop.hintOff = false; }
  if (!Array.isArray(d.cats)) d.cats = [...new Set(d.products.map(p => p.cat))];
  d.products.forEach(p => { if (!d.cats.includes(p.cat)) d.cats.push(p.cat); if (!p.mods) p.mods = []; });
  if (!Array.isArray(d.mods)) d.mods = defaultMods(d.cats);
  if (!d.shop.staffUser) d.shop.staffUser = 'staff';
  if (!d.shop.staffPass) d.shop.staffPass = 'staff123';
  if (!d.shop.v3) { d.shop.v3 = true; d.shop.hintOff = false; }
  const used = new Set(d.staff.map(s => s.pin).filter(Boolean));
  let n = 1001;
  d.staff.forEach(s => { if (!/^\d{4}$/.test(s.pin || '')) { while (used.has(String(n))) n++; s.pin = String(n); used.add(s.pin); } });
  return d;
}

/* ---------- state ---------- */
let D = loadData();
if (D) D = migrate(D); else { D = seed(); save(); }
D.attendance.forEach(a => { if (a.in < Date.now() - 45 * DAY) a.photo = null; });
let session = null;
try { session = JSON.parse(localStorage.getItem(S_KEY)); } catch (e) {}
const UI = {tc:null, cashier:'', view:null, step:null, shot:null, loginErr:'', pickStaff:null,
  cat:'All', q:'', cart:[], disc:DISCS[0], type:'Dine-in', cartOpen:false, pay:'Cash', kitchen:false, rc:null,
  range:7, ordFrom:dstr(Date.now()), ordTo:dstr(Date.now()), ordLimit:50, oq:'', invFilter:'all', iq:'', attRange:1, menuTab:'items', jobs:[]};
const staff = id => D.staff.find(s => s.id === id);
const prod = id => D.products.find(p => p.id === id);
const inv = id => D.inventory.find(i => i.id === id);
const isAdmin = () => !!session && session.role === 'admin';
const onShift = () => D.staff.filter(s => s.active && openAtt(s.id));
const openAtt = id => D.attendance.find(a => a.staffId === id && !a.out && sod(a.in) === sod(Date.now()));
if (session && session.role === 'staff') session = {role:'staff'};
function applyTheme() { const t = D.shop.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
const groupsFor = p => D.mods.filter(g => (g.cats || []).includes(p.cat) || (p.mods || []).includes(g.id));

/* ---------- toast & modal ---------- */
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2800); }
function modal(html, wide) {
  $('#modal').innerHTML = `<div class="bd" data-a="bd"><div class="sheet ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = $('#modal [autofocus]'); if (f) f.focus();
}
function closeModal() { stopCam(); $('#modal').innerHTML = ''; }
function confirmModal(title, msg, action, id, label) {
  modal(`<h3>${esc(title)}</h3><p class="sub" style="margin-top:0">${esc(msg)}</p><div class="actions"><button class="btn ghost" data-a="modal-close">Cancel</button><button class="btn" data-a="${action}" data-id="${esc(id || '')}">${esc(label)}</button></div>`);
}

/* ---------- views registry ---------- */
const VIEWS = {
  dashboard:{t:'Dashboard', i:'dashboard'}, pos:{t:'Register', i:'coffee'}, orders:{t:'Orders', i:'receipt'}, inventory:{t:'Inventory', i:'box'},
  menu:{t:'Menu', i:'list'}, staff:{t:'Staff', i:'users'}, attendance:{t:'Attendance', i:'clock'}, settings:{t:'Settings', i:'sliders'}
};
const navKeys = () => isAdmin() ? ['dashboard','pos','orders','inventory','menu','staff','attendance','settings'] : ['pos','orders','inventory','attendance'];
const FN = () => ({dashboard:dashView, pos:posView, orders:ordersView, inventory:invView, menu:menuView, staff:staffView, attendance:attView, settings:setView, more:moreView});

/* ---------- render ---------- */
function render() {
  const app = $('#app');
  if (!session) { app.innerHTML = loginView(); return; }
  if (UI.view !== 'more' && !navKeys().includes(UI.view)) UI.view = navKeys()[0];
  UI.jobs = [];
  const inner = FN()[UI.view]();
  const keys = navKeys(), bottom = keys.slice(0, 4);
  const moreOn = UI.view === 'more' || (keys.length > 4 && !bottom.includes(UI.view));
  const title = UI.view === 'more' ? (isAdmin() ? 'More' : 'Account') : VIEWS[UI.view].t;
  const on = onShift().length;
  const chip = `<div class="chip-user">${av(null, 'sm', isAdmin() ? 'AD' : 'ST')}<div class="who"><b>${isAdmin() ? 'Admin' : 'Staff'}</b><small>${isAdmin() ? 'Owner' : on + ' on shift'}</small></div></div>`;
  app.innerHTML = `<div class="shell">
    <aside class="side"><div class="side-brand"><span class="logo">${LOGO}</span><span class="t">${esc(D.shop.name)}</span></div>
      <nav>${keys.map(k => `<button class="nav ${UI.view === k ? 'on' : ''}" data-a="nav" data-v="${k}" title="${VIEWS[k].t}">${ic(VIEWS[k].i)}<span>${VIEWS[k].t}</span></button>`).join('')}</nav>
      <div class="side-foot">${chip}<button class="btn ghost sm" data-a="signout" title="Sign out">${ic('logout')}<span>Sign out</span></button></div>
    </aside>
    <main class="main"><header class="top"><h2>${title}</h2>${chip}</header><div class="content">${inner}</div></main>
    <nav class="tabs" aria-label="Main">${bottom.map(k => `<button class="tab ${UI.view === k ? 'on' : ''}" data-a="nav" data-v="${k}">${ic(VIEWS[k].i)}<span>${VIEWS[k].t}</span></button>`).join('')}
      <button class="tab ${moreOn ? 'on' : ''}" data-a="nav" data-v="more">${ic('more')}<span>${isAdmin() ? 'More' : 'Account'}</span></button></nav>
  </div>`;
  drawCharts();
}
function av(st, cls, lbl) { return `<span class="av ${cls || ''}">${st && st.photo ? `<img alt="" src="${st.photo}">` : esc(st ? initials(st.name) : (lbl || 'AD'))}</span>`; }

/* ---------- login & selfie ---------- */
function loginView() {
  let body;
  {
    body = `<form data-f="login"><div class="f"><label for="lu">Username</label><input id="lu" name="u" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus></div>
      <div class="f"><label for="lp">Password</label><input id="lp" name="p" type="password" autocomplete="current-password" required></div>
      <div class="formerr" id="lerr">${esc(UI.loginErr)}</div><button class="btn block lg">Sign in</button></form>
      <p class="muted" style="margin-top:14px;text-align:center">Everyone on the staff side shares one sign-in. Employees clock in from the Attendance tab.</p>`;
  }

function stockState(p) {
  let s = 'ok';
  for (const r of p.recipe || []) { const it = inv(r.inv); if (!it) continue; if (it.qty < r.qty) return 'out'; if (it.qty <= it.low) s = 'low'; }
  return s;
}
const unitPrice = c => prod(c.pid).price + (c.opts || []).reduce((s, o) => s + o.price, 0);
const optText = opts => (opts || []).map(o => o.n).join(', ');
function cleanCart() { UI.cart = UI.cart.filter(c => prod(c.pid)); }
function totals() {
  cleanCart();
  const sub = UI.cart.reduce((s, c) => s + unitPrice(c) * c.qty, 0);
  const disc = Math.round(sub * UI.disc.pct) / 100;
  return {sub, disc, total:round2(sub - disc), count:UI.cart.reduce((s, c) => s + c.qty, 0)};
}
function canAdd(p) {
  const need = {};
  [...UI.cart.map(c => [prod(c.pid), c.qty]), [p, 1]].forEach(([pp, q]) => (pp.recipe || []).forEach(r => need[r.inv] = (need[r.inv] || 0) + r.qty * q));
  return Object.keys(need).every(id => { const it = inv(id); return !it || it.qty >= need[id]; });
}

}

/* ---------- dashboard ---------- */
function barSVG(w, h, labels, vals, o) {
  o = o || {}; w = Math.max(w, 220);
  const m = {l:48, r:6, t:8, b:26}, iw = w - m.l - m.r, ih = h - m.t - m.b, fy = o.fy || short, ft = o.ft || money0;
  const raw = Math.max(...vals, o.min || 1), p = Math.pow(10, Math.floor(Math.log10(raw))), nn = raw / p, mx = (nn <= 1 ? 1 : nn <= 2 ? 2 : nn <= 4 ? 4 : nn <= 8 ? 8 : 10) * p;
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = m.t + ih - ih * i / 4; g += `<line class="gl" x1="${m.l}" x2="${w - m.r}" y1="${y}" y2="${y}"/><text class="ax" x="${m.l - 8}" y="${y + 4}" text-anchor="end">${fy(mx * i / 4)}</text>`; }
  const step = iw / vals.length, bw = Math.max(3, Math.min(34, step * .62));
  vals.forEach((v, i) => {
    const x = m.l + step * i + (step - bw) / 2, bh = ih * v / mx, y = m.t + ih - bh;
    g += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh, v > 0 ? 1 : 0).toFixed(1)}" rx="${Math.min(4, bw / 2)}" style="fill:${o.color || 'var(--accent)'}"><title>${esc(labels[i])}: ${ft(v)}</title></rect>`;
    if (i % (o.every || 1) === 0) g += `<text class="ax" x="${(x + bw / 2).toFixed(1)}" y="${h - 8}" text-anchor="middle">${esc(labels[i])}</text>`;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.label || 'Bar chart')}">${g}</svg>`;
}
const COLORS = ['var(--accent)', 'var(--c3)', 'var(--c4)', 'var(--c2)', 'var(--c5)'];
function donutSVG(parts, center) {
  const R = 52, C = 2 * Math.PI * R, tot = parts.reduce((s, p) => s + p.v, 0) || 1; let off = 0, g = '';
  parts.forEach((p, i) => { const len = Math.max(0, p.v / tot * C - (parts.length > 1 ? 2 : 0)); g += `<circle cx="70" cy="70" r="${R}" fill="none" stroke-width="16" style="stroke:${COLORS[i % 5]}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(p.n)}: ${money0(p.v)}</title></circle>`; off += p.v / tot * C; });
  return `<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Sales by category"><circle cx="70" cy="70" r="${R}" fill="none" stroke-width="16" style="stroke:var(--surface2)"/>${g}<text x="70" y="68" text-anchor="middle" class="ax" style="font-size:12px">Total</text><text x="70" y="86" text-anchor="middle" style="font-size:16px;font-weight:600;fill:var(--ink);font-family:inherit">${short(center)}</text></svg>`;
}
const hbars = (rows, fmt) => { const mx = Math.max(...rows.map(r => r.v), 1); return rows.map(r => `<div class="hb"><div class="hb-l"><span>${esc(r.n)}</span><b>${fmt(r)}</b></div><div class="hb-t"><i style="width:${(r.v / mx * 100).toFixed(1)}%"></i></div></div>`).join(''); };
function dashView() {
  const days = UI.range, now = Date.now(), start = days === 1 ? sod(now) : sod(now - (days - 1) * DAY), len = days;
  const live = D.orders.filter(o => !o.void), cur = live.filter(o => o.ts >= start);
  const pStart = start - len * DAY, pEnd = days === 1 ? pStart + (now - start) : start;
  const prev = live.filter(o => o.ts >= pStart && o.ts < pEnd);
  const sum = a => a.reduce((s, o) => s + o.total, 0), cnt = a => a.reduce((s, o) => s + o.items.reduce((x, i) => x + i.qty, 0), 0);
  const k = {sales:sum(cur), orders:cur.length, avg:cur.length ? sum(cur) / cur.length : 0, items:cnt(cur)};
  const kp = {sales:sum(prev), orders:prev.length, avg:prev.length ? sum(prev) / prev.length : 0, items:cnt(prev)};
  const plabel = days === 1 ? 'yesterday' : 'previous ' + days + ' days';
  const delta = key => { if (!kp[key]) return `<span class="delta">No earlier data</span>`; const d = (k[key] - kp[key]) / kp[key] * 100; return `<span class="delta ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d.toFixed(0)}% vs ${plabel}</span>`; };
  let tl = [], tv = [], every = 1;
  if (days === 1) { for (let h = 6; h <= 21; h++) { tl.push(hourLabel(h)); tv.push(cur.filter(o => new Date(o.ts).getHours() === h).reduce((s, o) => s + o.total, 0)); } every = 2; }
  else { for (let i = 0; i < days; i++) { const d = start + i * DAY; tl.push(days <= 7 ? new Date(d).toLocaleDateString('en-PH', {weekday:'short'}) : fmtDate(d)); tv.push(0); } cur.forEach(o => { const ix = Math.round((sod(o.ts) - start) / DAY); if (tv[ix] !== undefined) tv[ix] += o.total; }); every = days <= 7 ? 1 : 5; }
  const hl = [], hv = []; for (let h = 6; h <= 21; h++) { hl.push(hourLabel(h)); hv.push(cur.filter(o => new Date(o.ts).getHours() === h).length); }
  UI.jobs = [
    {id:'c-trend', fn:w => barSVG(w, 230, tl, tv, {every, label:'Sales over time'})},
    {id:'c-hours', fn:w => barSVG(w, 200, hl, hv, {every:3, fy:n => Math.round(n), ft:n => n + ' orders', min:4, color:'var(--c4)', label:'Orders by hour'})}
  ];
  const by = (arr, f) => { const m = {}; arr.forEach(o => f(o, m)); return Object.entries(m).map(([n, v]) => ({n, v})).sort((a, b) => b.v - a.v); };
  const cats = by(cur, (o, m) => o.items.forEach(i => m[i.cat || 'Other'] = (m[i.cat || 'Other'] || 0) + i.price * i.qty));
  const prods = by(cur, (o, m) => o.items.forEach(i => m[i.name] = (m[i.name] || 0) + i.qty)).slice(0, 6);
  const cash = by(cur, (o, m) => m[o.staffName] = (m[o.staffName] || 0) + o.total).slice(0, 6);
  const pays = by(cur, (o, m) => m[o.pay] = (m[o.pay] || 0) + o.total);
  const ptot = pays.reduce((s, p) => s + p.v, 0) || 1, ctot = cats.reduce((s, p) => s + p.v, 0);
  const low = D.inventory.filter(i => i.qty <= i.low).sort((a, b) => a.qty / (a.low || 1) - b.qty / (b.low || 1));
  const range = days === 1 ? fmtDateL(now) : fmtDate(start) + ' to ' + fmtDate(now);
  return `<div class="bar"><div class="seg">${[[1,'Today'],[7,'7 days'],[30,'30 days']].map(([v, l]) => `<button data-a="range" data-v="${v}" class="${UI.range === v ? 'on' : ''}">${l}</button>`).join('')}</div><span class="muted">${range}</span></div>
  <div class="kpis">${[['Net sales', money0(k.sales), 'sales'], ['Orders', num(k.orders), 'orders'], ['Average order', money(k.avg), 'avg'], ['Items sold', num(k.items), 'items']].map(([l, v, key]) => `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div>${delta(key)}</div>`).join('')}</div>
  <div class="dash">
    <div class="card w4"><h3>Sales ${days === 1 ? 'by hour' : 'by day'}</h3><div class="chart" id="c-trend"></div></div>
    <div class="card w2"><h3>Sales by category</h3>${cats.length ? `<div class="donut">${donutSVG(cats, ctot)}<div class="legend">${cats.map((c, i) => `<div><i style="background:${COLORS[i % 5]}"></i><span>${esc(c.n)}</span><b>${(c.v / ctot * 100).toFixed(0)}%</b></div>`).join('')}</div></div>` : '<div class="empty">No sales yet.</div>'}</div>
    <div class="card w2"><h3>Top items</h3>${prods.length ? hbars(prods, r => r.v + ' sold') : '<div class="empty">No sales yet.</div>'}</div>
    <div class="card w2"><h3>Busy hours</h3><div class="chart" id="c-hours"></div></div>

async function saveFile(name, data) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({filename:name, data}); toast('Saved ' + name); return; }
  } catch (e) { if (e && e.code === 'declined') return; if (!e || e.code !== 'unavailable') { toast('Could not save the file.'); return; } }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data])); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  catch (e) { toast('Downloads are not available here.'); }
}
function salesCSV() {
  const rows = [['Order no','Date','Time','Staff','Type','Items','Subtotal','Discount','Total','Payment','Status']];
  D.orders.forEach(o => rows.push([o.no, dstr(o.ts), fmtTime(o.ts), o.staffName, o.type, o.items.map(i => i.qty + 'x ' + i.name + (i.opts && i.opts.length ? ' (' + optText(i.opts) + ')' : '')).join('; '), o.sub, o.disc, o.total, o.pay, o.void ? 'Void' : 'Paid']));
  return rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
}

    const fd = new FormData(f), u = fd.get('u').trim(), p = fd.get('p');
    if (p.length < 4) return toast('Password needs at least 4 characters.');
    if (u.toLowerCase() === String(D.shop.adminUser).toLowerCase()) return toast('The admin already uses that username.');
    D.shop.staffUser = u; D.shop.staffPass = p; D.shop.hintOff = true; save(); render(); toast('Staff sign-in updated');
  },
  adminpw:f => {
    const fd = new FormData(f), u = fd.get('u').trim() || 'admin';
    if (u.toLowerCase() === String(D.shop.staffUser).toLowerCase()) return toast('The staff account already uses that username.');
    D.shop.adminUser = u;
    const p = fd.get('p'); if (p) { if (p.length < 6) return toast('Use at least 6 characters.'); D.shop.adminPass = p; }
    D.shop.hintOff = true; save(); render(); toast('Sign-in updated');
  }
};
document.addEventListener('submit', e => { const f = e.target.dataset && e.target.dataset.f; if (f && FORMS[f]) { e.preventDefault(); FORMS[f](e.target); } });

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'selfieFile' && el.files && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => cropToShot(im, false); im.src = fr.result; };
    fr.readAsDataURL(el.files[0]); el.value = '';
  }
  if (el.id === 'restoreFile' && el.files && el.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const d = JSON.parse(fr.result);
        if (!d || !Array.isArray(d.staff) || !Array.isArray(d.products) || !Array.isArray(d.orders) || !d.shop) throw 0;
        D = migrate(d); save(); session = null; saveSession(); Object.assign(UI, {view:null, cart:[]}); applyTheme(); render(); toast('Backup restored');
      } catch (err) { toast('That file is not a valid backup.'); }
    };
    fr.readAsText(el.files[0]); el.value = '';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) closeModal(); });
window.addEventListener('afterprint', () => { const pa = $('#printArea'); if (pa) pa.innerHTML = ''; });
window.addEventListener('pagehide', stopCam);

save();
applyTheme();
render();
})();
</script>
</body>
</html>
